$kind: http-request
url: "{{base_url}}/api/auth/ktp/upload/"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: reference
      value: "{{otp_reference}}"
    - type: text
      key: purpose
      value: "{{purpose}}"
    - type: file
      key: ktp
      src:
        - ""
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
    language: text/javascript
order: 4000
