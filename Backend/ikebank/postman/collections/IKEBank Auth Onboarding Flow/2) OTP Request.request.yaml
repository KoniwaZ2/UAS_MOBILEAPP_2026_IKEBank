$kind: http-request
url: "{{base_url}}/api/auth/otp/request/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "phone_number": "{{phone_number}}",
      "email": "{{email}}",
      "purpose": "{{purpose}}"
    }
scripts:
  - type: afterResponse
    code: >-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });

      const body = pm.response.json();

      const smsItem = (body.otp_requests || []).find(x => x.channel === 'sms');

      pm.test('SMS OTP item exists', function () {
        pm.expect(smsItem).to.exist;
      });

      if (smsItem) {
        pm.collectionVariables.set('otp_reference', smsItem.reference || '');
        pm.collectionVariables.set('debug_otp_code', smsItem.debug_otp_code || '');
      }
    language: text/javascript
order: 2000
