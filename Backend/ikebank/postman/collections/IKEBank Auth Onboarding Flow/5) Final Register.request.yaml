$kind: http-request
url: "{{base_url}}/api/auth/register/"
method: POST
body:
  type: formdata
  content:
    - type: text
      key: otp_reference
      value: "{{otp_reference}}"
    - type: text
      key: purpose
      value: "{{purpose}}"
    - type: text
      key: phone_number
      value: "{{phone_number}}"
    - type: text
      key: email
      value: "{{email}}"
    - type: text
      key: password
      value: TestPass123!
    - type: text
      key: password_confirmation
      value: TestPass123!
    - type: text
      key: name
      value: Final Register Test
    - type: file
      key: ktp
      src:
        - ""
    - type: text
      key: nik
      value: "{{raw_nik}}"
    - type: text
      key: born_place
      value: Jakarta
    - type: text
      key: born_date
      value: 2000-01-01
    - type: text
      key: gender
      value: Male
    - type: text
      key: address
      value: Alamat Test
    - type: text
      key: religion
      value: Islam
    - type: text
      key: mother_name
      value: Ibu Test
    - type: text
      key: pin
      value: "123456"
    - type: text
      key: pin_confirmation
      value: "123456"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 201', function () {
        pm.response.to.have.status(201);
      });
    language: text/javascript
order: 5000
