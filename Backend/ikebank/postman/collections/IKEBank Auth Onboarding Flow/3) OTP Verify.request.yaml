$kind: http-request
url: "{{base_url}}/api/auth/otp/verify/"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "reference": "{{otp_reference}}",
      "otp_code": "{{debug_otp_code}}",
      "purpose": "{{purpose}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test('Status is 200', function () {
        pm.response.to.have.status(200);
      });
      const body = pm.response.json();
      pm.test('OTP verified', function () {
        pm.expect(body.verified).to.eql(true);
      });
    language: text/javascript
order: 3000
